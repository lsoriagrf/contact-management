<section class="page-shell create-page">
  <div class="create-page__card">
    <app-page-header title="Crear contacto"></app-page-header>

    <form class="create-form" (ngSubmit)="saveContact()">
      <div class="input-row">
        <i class="fa-solid fa-user input-row__icon" aria-hidden="true"></i>
        <input id="name" type="text" [(ngModel)]="newContact.name" name="name" placeholder="Nombre completo" required />
      </div>

      <div class="input-row">
        <i class="fa-solid fa-envelope input-row__icon" aria-hidden="true"></i>
        <input id="email" type="email" [(ngModel)]="newContact.email" name="email" placeholder="Correo electrónico" required />
      </div>

      <div class="input-row">
        <i class="fa-solid fa-phone input-row__icon" aria-hidden="true"></i>
        <input id="phone" type="text" [(ngModel)]="newContact.phone" name="phone" placeholder="Teléfono" />
      </div>

      <div class="input-row">
        <i class="fa-solid fa-location-dot input-row__icon" aria-hidden="true"></i>
        <input id="address" type="text" [(ngModel)]="newContact.address" name="address" placeholder="Dirección" />
      </div>

      <div class="input-row">
        <i class="fa-solid fa-cake-candles input-row__icon" aria-hidden="true"></i>
        <input id="birthday" type="date" [(ngModel)]="birthdayInput" name="birthday" />
      </div>

      <div class="select-grid">
        <div class="select-box">
          <label class="select-box__label" for="status">Estado</label>
          <select id="status" [(ngModel)]="newContact.status" name="status">
            @for (status of statusOptions; track status) {
              <option [value]="status">{{ status }}</option>
            }
          </select>
        </div>

        <div class="select-box">
          <label class="select-box__label" for="label">Etiqueta</label>
          <select id="label" [(ngModel)]="newContact.label" name="label">
            @for (label of labelOptions; track label) {
              <option [value]="label">{{ label }}</option>
            }
          </select>
        </div>
      </div>

      <label class="favorite-check">
        <input type="checkbox" [(ngModel)]="newContact.favorite" name="favorite" />
        Marcar como favorito
      </label>

      <button type="submit" class="btn-save-contact">Guardar contacto</button>
    </form>
  </div>
</section>
