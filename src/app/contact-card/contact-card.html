<div class="user-row" (click)="viewDetails()">
  
  <div class="avatar">
    <app-initials-avatar [name]="contact.name" [size]="40"></app-initials-avatar>
    @if (contact.status === 'activo') {
      <span class="status-dot activo"></span>
    }
  </div>

  <div class="info">
    <span class="name">{{ contact.name | formatData:'camel' }}</span>
    <span class="email">{{ contact.email | formatData:'lower' }}</span>
  </div>

  <div class="actions">
    <span class="star" (click)="$event.stopPropagation(); toggleFavorite()" [class.is-fav]="contact.favorite">
      @if (contact.favorite) {
        ★
      } @else {
        ☆
      }
    </span>
  </div>
</div>
