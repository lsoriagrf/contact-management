<div class="user-row">
  
  <div class="avatar">
    <app-initials-avatar [name]="contact.name" [size]="40"></app-initials-avatar>
  </div>

  <div class="info">
    <span class="name">{{ contact.name | formatData:'camel' }}</span>
    <span class="email">{{ contact.email | formatData:'lower' }}</span>
    <button class="btn-detail" (click)="viewDetails()">Ver detalle</button>
  </div>

  <div class="actions">
    <div class="status-indicator">
      <span class="status-dot" [ngClass]="contact.status"></span>
      <span class="status-text">{{ contact.status }}</span>
    </div>

    <span class="star" (click)="toggleFavorite()" [class.is-fav]="contact.favorite">
      @if (contact.favorite) {
        ★
      } @else {
        ☆
      }
    </span>
  </div>
</div>
